name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

env:
  WORKING_DIR: 'learning_tracker'

jobs:
  build-apk:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ${{ env.WORKING_DIR }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Inject Gradle Compatibility & Desugaring Flags
        run: |
          echo "android.newDsl=false" >> android/gradle.properties
          echo "android.builtInKotlin=false" >> android/gradle.properties

      - name: Upgrade Gradle Wrapper
        run: |
          sed -i 's/gradle-8.10.2-bin.zip/gradle-8.14-all.zip/g' android/gradle/wrapper/gradle-wrapper.properties || true
          sed -i 's/gradle-8.10.2-all.zip/gradle-8.14-all.zip/g' android/gradle/wrapper/gradle-wrapper.properties || true

      - name: Enable Core Library Desugaring
        run: |
          # Inject desugaring dependency into build.gradle or build.gradle.kts
          if [ -f "android/app/build.gradle.kts" ]; then
            sed -i '/compileOptions {/a \        isCoreLibraryDesugaringEnabled = true' android/app/build.gradle.kts
            echo 'dependencies { coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.4") }' >> android/app/build.gradle.kts
          elif [ -f "android/app/build.gradle" ]; then
            sed -i '/compileOptions {/a \        coreLibraryDesugaringEnabled true' android/app/build.gradle
            echo 'dependencies { coreLibraryDesugaring "com.android.tools:desugar_jdk_libs:2.1.4" }' >> android/app/build.gradle
          fi

      - name: Install Project Dependencies
        run: flutter pub get

      - name: Build Release APK
        run: flutter build apk --release --target-platform android-arm64 --android-skip-build-dependency-validation

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: focus-lab-android-apk
          path: ${{ env.WORKING_DIR }}/build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
